[package]
name = "pfnext"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"]}
chrono-tz = "0.9.0"
confy = "0.6.1"
dotenv = "0.15.0"
env_logger = "0.11.8"
futures = "0.3.31"
indexmap = "2.9.0"
jsonwebtoken = { version = "9.3.0", default-features = false }
lazy_static = "1.4.0"
log = { version = "0.4.27", features = ["std"] }
mail-send = "0.5.1"
passwords = "3.1.16"
password-auth = "1"
public-ip-address = "0.3.3"
rand = "0.8.5"
rand_chacha = "0.9.0"
rand_core = {version = "0.9.3", features = ["os_rng"] }
result = "1.0.0"
rocket = {  version = "0.5.1", features = ["json", "secrets"] }
rocket_cors = "0.6.0"
rocket_db_pools = { version = "0.2.0", features = ["sqlx_postgres", "deadpool_redis"] }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
rocket-client-addr = "0.5.4"
serde = { version = "1.0.198", features = ["derive"] }
sqlx = { version = "0.8.2", features = ["chrono", "postgres", "runtime-tokio-rustls", "macros"] }
strfmt = "0.2.4"
time = { version = "0.3.41", features = ["std"] }
tokio = { version = "1.37.0", features = ["full"] }
toml = { version = "0.8.23", features = ["preserve_order"] }
urlencoding = "2.1.3"
user-agent-parser = { version = "0.3.6", features = ["rocket"] }
zeroize = "1.8.1"
multer = "3.1.0"
tokio-util = "0.7.15"
bytes = "1.10.1"
sha2 = "0.10.9"
hex = "0.4.3"
async-stream = "0.3.6"