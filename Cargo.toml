[package]
name = "pfnext"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"]}
chrono-tz = "0.9.0"
futures = "0.3.31"
confy = "0.6.1"
jsonwebtoken = { version = "9.3.0", default-features = false }
lazy_static = "1.4.0"
password-auth = "1"
rocket = {  version = "0.5.1", features = ["json", "secrets"] }

rocket_cors = "0.6.0"
rocket_db_pools = { version = "0.2.0", features = ["sqlx_postgres", "deadpool_redis"] }

serde = { version = "1.0.198", features = ["derive"] }
rand_core = {version = "0.9.3", features = ["os_rng"] }
rand_chacha = "0.9.0"
time = { version = "0.3.41", features = ["std"] }

tokio = "1.37.0"
sqlx = { version = "0.8.2", features = ["chrono", "postgres", "runtime-tokio-rustls", "macros"] }
dotenv = "0.15.0"

mail-send = "0.4.7"
passwords = "3.1.16"
urlencoding = "2.1.3"
rand = "0.8.5"
strfmt = "0.2.4"
zeroize = "1.8.1"
rocket-client-addr = "0.5.4"
public-ip-address = "0.3.3"
user-agent-parser = { version = "0.3.6", features = ["rocket"] }
